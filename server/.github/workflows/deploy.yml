name: CI/CD Pipeline

# Trigger: chỉ chạy khi có push vào branch main
on:
  push:
    branches:
      - main

jobs:
  # ============================================
  # JOB 1: TEST
  # Chạy trên GitHub's server (runner), không phải VPS của bạn
  # Mục đích: Đảm bảo code không bị lỗi trước khi deploy
  # ============================================
  test:
    name: Install & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Cache node_modules để các lần chạy sau nhanh hơn
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  # ============================================
  # JOB 2: DEPLOY
  # Chỉ chạy SAU KHI Job "test" pass thành công
  # SSH vào VPS và deploy ứng dụng
  # ============================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Phụ thuộc vào job "test" - nếu test fail thì job này không chạy
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          # Các giá trị này lấy từ GitHub Repository Secrets
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          # Script chạy trên VPS sau khi SSH thành công
          script: |
            APP_DIR="/app/nestjs-crud"

            # ---- Bước 1: Clone repo nếu chưa có, hoặc pull code mới nhất ----
            if [ -d "$APP_DIR/.git" ]; then
              echo ">>> Repo exists, pulling latest code..."
              cd $APP_DIR
              git pull origin main
            else
              echo ">>> Cloning repo for the first time..."
              mkdir -p $APP_DIR
              # QUAN TRỌNG: Thay YOUR_GITHUB_USERNAME/YOUR_REPO_NAME bằng repo thực của bạn
              git clone https://github.com/HaiTranThanh203/ts_fullstack_base.git $APP_DIR
              cd $APP_DIR
            fi

            # ---- Bước 2: Tạo file .env động từ GitHub Secrets ----
            # File này KHÔNG được commit lên git, được tạo mới mỗi lần deploy
            echo ">>> Creating .env file..."
            cat > .env << EOF
            PORT=3000
            MONGO_URI=${{ secrets.MONGO_URI_PROD }}
            EOF

            # ---- Bước 3: Build và khởi động container ----
            echo ">>> Building and starting Docker containers..."
            # --build: rebuild image (áp dụng code mới)
            # -d: chạy background (detached mode)
            docker-compose up -d --build

            # ---- Bước 4: Dọn dẹp các image cũ không còn dùng ----
            echo ">>> Cleaning up old Docker images..."
            docker image prune -f

            echo ">>> Deployment complete!"