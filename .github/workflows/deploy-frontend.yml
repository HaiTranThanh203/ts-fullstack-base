name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "client/**"

jobs:
  deploy:
    name: Deploy Frontend to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 10m
          script: |
            set -e

            echo "=== Step 1: Ensure SSL certs exist ==="
            if [ ! -f /etc/letsencrypt/live/thanhhaidev.me/fullchain.pem ]; then
              echo "SSL cert not found, skipping HTTPS setup"
            fi

            echo "=== Step 2: Update Nginx config ==="
            cat > /etc/nginx/sites-available/thanhhaidev.me << 'NGINXEOF'
            server {
                listen 80;
                listen [::]:80;
                server_name thanhhaidev.me www.thanhhaidev.me;
                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl http2;
                listen [::]:443 ssl http2;
                server_name thanhhaidev.me www.thanhhaidev.me;

                ssl_certificate     /etc/letsencrypt/live/thanhhaidev.me/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/thanhhaidev.me/privkey.pem;
                ssl_protocols       TLSv1.2 TLSv1.3;
                ssl_ciphers         HIGH:!aNULL:!MD5;

                access_log /var/log/nginx/thanhhaidev.me.access.log;
                error_log  /var/log/nginx/thanhhaidev.me.error.log;

                # Backend API — prefix /api/
                location /api/ {
                    proxy_pass http://localhost:3000;
                    proxy_set_header Host              $host;
                    proxy_set_header X-Real-IP         $remote_addr;
                    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                # Frontend — all other routes
                location / {
                    proxy_pass http://localhost:3001;
                    proxy_set_header Host              $host;
                    proxy_set_header X-Real-IP         $remote_addr;
                    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINXEOF

            echo "=== Step 3: Test and reload Nginx ==="
            nginx -t && systemctl reload nginx
            echo "Nginx reloaded OK"

            echo "=== Step 3: Clone/pull frontend repo ==="
            APP_DIR="/app/nextjs-frontend"
            if [ -d "$APP_DIR/.git" ]; then
              echo "Pulling latest code..."
              cd $APP_DIR && git pull origin main
            else
              echo "Cloning repo fresh..."
              git clone https://github.com/HaiTranThanh203/ts-fullstack-base.git $APP_DIR
            fi

            echo "=== Step 4: Build and start frontend ==="
            cd $APP_DIR/client
            docker-compose down 2>/dev/null || true
            docker-compose up -d --build
            docker image prune -f

            echo "=== Step 5: Verify ==="
            sleep 15
            echo "Docker containers:"
            docker ps --filter name=nextjs-frontend
            echo "Docker compose logs:"
            docker-compose logs --tail=20
            echo "Frontend health check:"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || echo "FAILED")
            echo "HTTP_CODE: $HTTP_CODE"
            echo "=== Frontend deployed! ==="
