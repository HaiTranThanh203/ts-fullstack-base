# File: /etc/nginx/sites-available/thanhhaidev.me
# Sau khi tạo file này trên VPS, chạy lệnh symlink:
#   sudo ln -s /etc/nginx/sites-available/thanhhaidev.me /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Domain của bạn - Certbot sẽ tự động thêm block HTTPS (port 443) phía dưới
    server_name thanhhaidev.me www.thanhhaidev.me;

    # Ghi log riêng cho domain này (dễ debug)
    access_log /var/log/nginx/thanhhaidev.me.access.log;
    error_log  /var/log/nginx/thanhhaidev.me.error.log;

    location / {
        # Chuyển toàn bộ request đến NestJS container đang chạy ở port 3000
        proxy_pass http://localhost:3000;

        # Giữ nguyên thông tin request gốc (IP client, host, protocol)
        # NestJS cần những header này để log và xử lý đúng
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cho các API call có thể chậm (upload, xử lý nặng)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ============================================================
# PHẦN DƯỚI DO CERTBOT TỰ THÊM - KHÔNG CẦN VIẾT THỦ CÔNG
# Sau khi chạy certbot, nó sẽ tự thêm server block port 443
# và redirect 80 -> 443 tự động
# ============================================================